version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: kap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kap_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kap_change_me_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-kap_whatsapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kap_admin} -d ${POSTGRES_DB:-kap_whatsapp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kap_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: kap_whatsapp_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-kap_admin}:${POSTGRES_PASSWORD:-kap_change_me_in_prod}@db:5432/${POSTGRES_DB:-kap_whatsapp}
      REDIS_URL: redis://redis:6379/0
      ENABLE_OUTBOUND_MESSAGES: ${ENABLE_OUTBOUND_MESSAGES:-false}
      DRY_RUN: ${DRY_RUN:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: kap_whatsapp_worker
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.message_worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-kap_admin}:${POSTGRES_PASSWORD:-kap_change_me_in_prod}@db:5432/${POSTGRES_DB:-kap_whatsapp}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build: .
    container_name: kap_whatsapp_scheduler
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.message_worker.celery_app", "beat", "--loglevel=info"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-kap_admin}:${POSTGRES_PASSWORD:-kap_change_me_in_prod}@db:5432/${POSTGRES_DB:-kap_whatsapp}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
