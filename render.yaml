services:
  - type: web
    name: maxis-gold-jewellery-whatsapp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Maxis Gold Jewellery WhatsApp Automation
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///./kap_whatsapp.db
      - key: ENABLE_OUTBOUND_MESSAGES
        value: "false"
      - key: DRY_RUN
        value: "true"
      - key: META_GRAPH_API_VERSION
        value: v21.0
      - key: META_WEBHOOK_VERIFY_TOKEN
        value: local_dev_verify_token
      - key: META_APP_SECRET
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_WABA_ID
        sync: false
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
